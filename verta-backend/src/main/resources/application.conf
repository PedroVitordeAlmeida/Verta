ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.verta.backend.ApplicationKt.module ]
    }
}

database {
    host = "localhost"
    host = ${?DB_HOST}
    port = "5432"
    port = ${?DB_PORT}
    name = "verta"
    name = ${?DB_NAME}
    user = "verta_user"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
}

jwt {
    secret = "change-me-in-env"
    secret = ${?JWT_SECRET}
    issuer = "verta-backend"
    issuer = ${?JWT_ISSUER}
    audience = "verta-app"
    audience = ${?JWT_AUDIENCE}
    realm = "verta-app"
    realm = ${?JWT_REALM}
}

cors {
    allowedHost = "localhost:3000"
    allowedHost = ${?CORS_ALLOWED_HOST}
}
